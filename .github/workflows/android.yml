name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP installs any missing platform / build-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfferPilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/

      # After every build on main, publish the APK to the fixed "latest" release so it can be downloaded straight to the phone
      - name: Publish APK to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FKUB-debug.apk
          cp FKUB-debug.apk OfferPilot-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FKUB-debug.apk OfferPilot-debug.apk \
            --title "FKUB latest build (${GITHUB_SHA::7})" \
            --notes "Debug APK built automatically from main. Recognition and advice only; it never taps anything. English by default, Chinese in the app. 由 main 分支自动构建的调试版，App 内可切换中文。" \
            --prerelease
