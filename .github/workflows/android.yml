name: Android CI

on:
  push:
    branches: [ main ]
    # Pushing a tag like v1.0.0 builds a release APK signed with the maintainer's key and publishes a versioned release
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP installs any missing platform / build-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FKUB-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/

      # After every build on main, publish the APK to the fixed "latest" release so it can be downloaded straight to the phone
      - name: Publish APK to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FKUB-debug.apk
          cp FKUB-debug.apk OfferPilot-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FKUB-debug.apk OfferPilot-debug.apk \
            --title "FKUB latest build (${GITHUB_SHA::7})" \
            --notes "Debug APK built automatically from main. Recognition and advice only; it never taps anything. English by default, Chinese in the app. 由 main 分支自动构建的调试版，App 内可切换中文。" \
            --prerelease

      # ---- Versioned release (tags v*): signed with the release key from repository secrets ----
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FKUB_KEYSTORE_BASE64: ${{ secrets.FKUB_KEYSTORE_BASE64 }}
          FKUB_KEYSTORE_PASSWORD: ${{ secrets.FKUB_KEYSTORE_PASSWORD }}
          FKUB_KEY_ALIAS: ${{ secrets.FKUB_KEY_ALIAS }}
          FKUB_KEY_PASSWORD: ${{ secrets.FKUB_KEY_PASSWORD }}
        run: |
          if [ -z "$FKUB_KEYSTORE_BASE64" ]; then
            echo "::error::Release secrets are missing (FKUB_KEYSTORE_BASE64 etc.). See docs/RELEASING.md."
            exit 1
          fi
          export FKUB_KEYSTORE_PATH="$RUNNER_TEMP/fkub-release.jks"
          echo "$FKUB_KEYSTORE_BASE64" | base64 -d > "$FKUB_KEYSTORE_PATH"
          export FKUB_VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease
          rm -f "$FKUB_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk "FKUB-${GITHUB_REF_NAME}.apk"

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "FKUB-${GITHUB_REF_NAME}.apk" \
            --title "FKUB ${GITHUB_REF_NAME}" \
            --notes "Signed release build. If you installed a debug build before, uninstall it once first (different signing key). 正式签名版。如果之前装过调试版，需要先卸载一次（签名不同）。"
