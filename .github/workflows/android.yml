name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME），AGP 会自动补齐缺少的 platform / build-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfferPilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/

      # main 分支每次构建后，把 APK 发布到固定的 "latest" Release，手机上可直接下载
      - name: Publish APK to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OfferPilot-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OfferPilot-debug.apk \
            --title "OfferPilot 最新构建 (${GITHUB_SHA::7})" \
            --notes "main 分支自动构建的调试版 APK。只做识别与建议，不会自动点击。Uber 适配器尚待真机验证，见 docs/PHASE0.md。" \
            --prerelease
